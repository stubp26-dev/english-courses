<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan your English courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1330;--blue:#2B3FD6;--paper:#F6F7FF;--lemon:#FFE45C;--mint:#6FE3BE;--line:#D3D7F5;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
h1,h2{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;line-height:1.05}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
[hidden]{display:none!important}
/* hero */
#hero{min-height:100vh;background:var(--blue);color:#fff;display:grid;align-items:center;gap:40px;padding:32px 24px;grid-template-columns:1fr;max-width:none}
#hero .wrap{display:grid;gap:48px;max-width:1040px;margin:auto;width:100%;align-items:center}
@media(min-width:820px){#hero .wrap{grid-template-columns:1.1fr 1fr}}
#hero h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:800;letter-spacing:-.02em}
#hero p{font-size:1.15rem;max-width:34ch;margin:20px 0 32px;opacity:.92}
.start{background:var(--lemon);color:var(--ink);border:0;border-radius:999px;padding:16px 34px;font-weight:700;font-size:1.1rem;cursor:pointer;transition:transform .15s}
.start:hover{transform:translateY(-2px)}
.chat{display:flex;flex-direction:column;gap:14px}
.b{max-width:82%;padding:14px 18px;border-radius:22px;font-size:1.05rem;font-weight:500;opacity:0;animation:pop .5s forwards}
.b.l{background:var(--lemon);color:var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.b.r{background:#fff;color:var(--ink);border-bottom-right-radius:6px;align-self:flex-end}
.b.m{background:var(--mint);color:var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.b:nth-child(1){animation-delay:.4s}.b:nth-child(2){animation-delay:1.3s}.b:nth-child(3){animation-delay:2.2s}.b:nth-child(4){animation-delay:3.1s}.b:nth-child(5){animation-delay:4s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
/* app */
#top{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 20px 12px;border-bottom:1px solid var(--line)}
#bar{display:flex;gap:6px;max-width:720px;margin:auto}
#bar i{flex:1;height:6px;border-radius:9px;background:var(--line);transition:background .3s}
#bar i.d{background:var(--blue)}
main{max-width:720px;margin:auto;padding:36px 20px 80px}
.step h2{font-size:clamp(2rem,5vw,2.8rem);font-weight:800;color:var(--blue)}
.sub{margin:6px 0 28px;font-size:1.1rem;opacity:.75}
.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.q:nth-child(odd){border-radius:20px 20px 20px 6px}
.q label{display:block;font-weight:700;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px}
input:focus,textarea:focus{border-color:var(--blue);outline:none}
.oi{margin-top:10px}
.grid{display:grid;gap:6px}
.row{display:grid;grid-template-columns:48px repeat(4,1fr);gap:6px;align-items:center}
.row small{font-size:.72rem;text-align:center;line-height:1.2;opacity:.7}
.row .chip{height:38px;border-radius:12px;padding:0}
.row .chip.on::after{content:"\2713";font-weight:700}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.go,.ghost{border-radius:999px;padding:14px 30px;font-weight:700;cursor:pointer;border:2px solid var(--blue)}
.go{background:var(--blue);color:#fff}.go:hover{background:var(--ink);border-color:var(--ink)}
.go:disabled{opacity:.5}
.ghost{background:transparent;color:var(--blue)}
#done{max-width:560px;margin:auto;padding:90px 24px;text-align:center}
#done h2{font-size:clamp(2.6rem,8vw,4rem);font-weight:800;color:var(--blue)}
#done .b{opacity:1;animation:none;display:inline-block;margin:24px 0 8px}
#done p{opacity:.8}
@media(prefers-reduced-motion:reduce){.b{opacity:1;animation:none}.start,.chip{transition:none}}
</style>
</head>
<body>

<section id="hero">
  <div class="wrap">
    <div>
      <h1>Let’s plan your English courses.</h1>
      <p>Thirty-six quick taps, seven short steps. Skip anything you’re not sure about.</p>
      <button class="start" id="start">Start</button>
    </div>
    <div class="chat" aria-hidden="true">
      <div class="b l">Hi! Ready to plan your courses?</div>
      <div class="b r">Yes, let’s go.</div>
      <div class="b m">مرحباً! أهلاً وسهلاً</div>
      <div class="b l">Conversation, IELTS or business English?</div>
      <div class="b r">Maybe all three.</div>
    </div>
  </div>
</section>

<div id="top" hidden><div id="bar"></div></div>
<main id="app" hidden><div id="steps"></div></main>

<section id="done" hidden>
  <h2>Thank you!</h2>
  <div class="b m">Your answers are in. We’ll take it from here.</div>
  <p id="note"></p>
  <button class="ghost" id="copy" hidden>Copy my answers</button>
</section>

<script>
// Paste your Google Apps Script web app URL between the quotes (see Code.gs).
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxaTIOjwvPYOLhgVaFbe74e7xR29L6VW0MORKrZlf6Ur7YGVRG0tpaalNCPbpjc8nd_lA/exec';

const D=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];
const T=[['Morning','8–12'],['Afternoon','12–4'],['Evening','4–8'],['Late','8–10']];

// [type, sheet column, question, options, allowOther]
const S=[
['The courses','What would you like to teach?',[
 ['many','Course types','Which types of courses would you like to offer?',['General conversation','Beginners','IELTS','TOEFL','Business English','Writing','Kids','Grammar'],1],
 ['many','Levels','Which levels can you teach?',['Beginner','Intermediate','Advanced']],
 ['one','Course length','How long should a course be?',['4 weeks','6 weeks','8 weeks','12 weeks'],1],
 ['one','Sessions per week','Sessions per week?',['1','2','3']],
 ['one','Session length','How long is each session?',['45 minutes','1 hour','1.5 hours','2 hours']],
 ['one','Max group size','Maximum students per group?',['5 or fewer','6 to 10','11 to 15','More than 15']],
 ['one','Group or private','Group classes or private lessons?',['Group only','Group and private','Private only']],
 ['one','Placement test','Placement test before starting?',['No test','Short written test','Short spoken interview','Both']],
 ['one','Books and materials','Books and materials?',['Students buy their own','Included in the price','My own materials, no book','Not decided'],1],
 ['one','Certificate','Certificate of completion?',['Yes','No','Maybe']]]],
['Your students','Who are the courses for?',[
 ['many','Audience','Who is the target audience?',['Children','Teenagers','University students','Professionals','Everyone'],1],
 ['many','Ages','Which ages would you accept?',['Under 10','10 to 14','15 to 18','19 to 25','26 and over']],
 ['one','Separate courses','Separate courses for each group?',['Yes','No, mixed is fine','Depends on the course']]]],
['Online and in person','Where will classes happen?',[
 ['many','Online platform','Which platform for online classes?',['Zoom','Google Meet','Microsoft Teams','WhatsApp video'],1],
 ['one','Amman venue','In-person in Amman: do you have a venue?',['Yes','No, I need help finding one','Not sure yet']],
 ['one','Teach in Irbid','Would you also teach in person in Irbid?',['Yes','No','Maybe later']],
 ['one','Travel Irbid-Amman','How often can you travel between Irbid and Amman?',['Once a week','Twice a week','A few times a month','Once a month','Not possible']]]],
['Your schedule','When are you free?',[
 ['grid','General availability','When can you teach in general?'],
 ['grid','Amman availability','When can you teach in person in Amman?'],
 ['long','Unavailable periods','Any periods you are not available? Holidays, travel, other work.'],
 ['one','Start date','When would you like to start the first course?',['Within 2 weeks','Within a month','In 1 to 2 months','Later']]]],
['Prices and payment','How will it work financially?',[
 ['text','Suggested price','Suggested price per course in JOD. Does it differ online and in person?'],
 ['one','Show prices','Show prices on the website?',['Yes, publicly','No, after registration','Starting-from price only']],
 ['many','Discounts','Which discounts would you consider?',['Early registration','Friends and groups','Returning students','Siblings','None']],
 ['many','Payment methods','How would you like to be paid?',['Cash','Bank transfer','CliQ','Mobile wallet','Online payment'],1],
 ['one','Deposit','Deposit to confirm a seat?',['Yes','No','In-person courses only']],
 ['one','Refund policy','If a student withdraws?',['Full refund before start','Partial refund in week one','No refunds','Case by case']]]],
['About you','What we show on the website.',[
 ['text','Name on website','Your full name as it should appear'],
 ['many','Qualifications','Your qualifications?',['University degree','CELTA','TEFL or TESOL','DELTA','Master’s degree'],1],
 ['one','Experience','Years of teaching experience?',['Under 1','1 to 3','3 to 5','5 to 10','Over 10']],
 ['one','Profile photo','Profile photo?',['I will send one','I need to take one','No photo']],
 ['one','Short bio','Short bio?',['I will write it','Help me write it']],
 ['one','Student reviews','Reviews from past students?',['Yes, I have some','Not yet']]]],
['Contact and name','Last step.',[
 ['many','Contact methods','Which contact methods should the website show?',['WhatsApp','Email','Instagram','Facebook','Phone call'],1],
 ['one','Public phone','Show your phone number publicly?',['Yes','No, form or email only','Separate business number']],
 ['text','Name suggestion','Suggest a name for the academy or brand']]]
];

const $=s=>document.querySelector(s);
const chip=(v,c='')=>`<button type="button" class="chip ${c}" data-v="${v}" aria-pressed="false">${v}</button>`;
const Q=([t,k,l,o,x])=>{
  const h=`<div class="q" data-t="${t}" data-k="${k}"><label>${l}</label>`;
  if(t==='text')return h+'<input type="text"></div>';
  if(t==='long')return h+'<textarea rows="3"></textarea></div>';
  if(t==='grid')return h+`<div class="grid"><div class="row"><span></span>${T.map(a=>`<small>${a[0]}<br>${a[1]}</small>`).join('')}</div>`+
    D.map(d=>`<div class="row" data-d="${d}"><b>${d.slice(0,3)}</b>${T.map(a=>`<button type="button" class="chip" data-v="${a[0]}" aria-pressed="false" aria-label="${d} ${a[0]}"></button>`).join('')}</div>`).join('')+'</div></div>';
  return h+`<div class="chips">${o.map(v=>chip(v)).join('')}${x?chip('Other…','oth'):''}</div>${x?'<input class="oi" type="text" placeholder="Please specify" hidden>':''}</div>`;
};

$('#steps').innerHTML=S.map((s,i)=>`<section class="step" data-i="${i+1}" hidden><h2>${s[0]}</h2><p class="sub">${s[1]}</p>${s[2].map(Q).join('')}
<div class="nav">${i?'<button class="ghost" data-go="-1">Back</button>':'<span></span>'}${i<S.length-1?'<button class="go" data-go="1">Next</button>':'<button class="go" id="send">Send my answers</button>'}</div></section>`).join('');
$('#bar').innerHTML=S.map(()=>'<i></i>').join('');

let cur=0;
function show(n){
  cur=n;
  $('#hero').hidden=n!==0;
  $('#top').hidden=$('#app').hidden=n<1||n>S.length;
  $('#done').hidden=n!==S.length+1;
  document.querySelectorAll('.step').forEach(s=>s.hidden=+s.dataset.i!==n);
  document.querySelectorAll('#bar i').forEach((b,i)=>b.classList.toggle('d',i<n));
  window.scrollTo(0,0);
  try{n>S.length?localStorage.removeItem(KEY):save();}catch(e){}
}

document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){
    const q=c.closest('.q'),was=c.classList.contains('on');
    if(q.dataset.t==='one')q.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
    c.classList.toggle('on',!was);
    q.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')));
    const oi=q.querySelector('.oi');
    if(oi){oi.hidden=!q.querySelector('.oth.on');if(!oi.hidden)oi.focus();}
    save();
    return;
  }
  const g=e.target.closest('[data-go]');
  if(g)show(cur+ +g.dataset.go);
});
$('#start').onclick=()=>show(1);

function collect(){
  const o={};
  document.querySelectorAll('.q').forEach(q=>{
    const t=q.dataset.t;let v;
    if(t==='text'||t==='long')v=q.querySelector('input,textarea').value.trim();
    else if(t==='grid')v=[...q.querySelectorAll('.row[data-d]')].map(r=>{
      const on=[...r.querySelectorAll('.on')].map(b=>b.dataset.v);
      return on.length?r.dataset.d+': '+on.join(', '):'';}).filter(Boolean).join(' | ');
    else{
      v=[...q.querySelectorAll('.chip.on:not(.oth)')].map(b=>b.dataset.v);
      const oi=q.querySelector('.oi');
      if(q.querySelector('.oth.on')&&oi.value.trim())v.push('Other: '+oi.value.trim());
      v=v.join('; ');
    }
    o[q.dataset.k]=v;
  });
  return o;
}

$('#send').onclick=async e=>{
  const btn=e.target,d=collect();
  btn.disabled=true;btn.textContent='Sending…';
  if(ENDPOINT){
    try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});}
    catch(err){btn.disabled=false;btn.textContent='Send my answers';alert('Could not send. Check your connection and tap Send again.');return;}
  }else{
    $('#note').textContent='Preview mode: no Google Sheet is connected yet. Copy the answers below instead.';
    $('#copy').hidden=false;
    $('#copy').onclick=()=>{navigator.clipboard.writeText(Object.entries(d).map(([k,v])=>k+': '+v).join('\n'));$('#copy').textContent='Copied';};
  }
  show(S.length+1);
};

// Keep answers after a refresh (stored in this browser only, cleared once sent)
const KEY='english-courses-draft';
const cid=b=>(b.closest('.row[data-d]')?b.closest('.row').dataset.d+'|':'')+b.dataset.v;
function save(){
  try{
    const a={};
    document.querySelectorAll('.q').forEach(q=>{
      const k=q.dataset.k,t=q.dataset.t;
      if(t==='text'||t==='long'){a[k]=q.querySelector('input,textarea').value;return;}
      const oi=q.querySelector('.oi');
      a[k]={c:[...q.querySelectorAll('.chip.on')].map(cid),o:oi?oi.value:''};
    });
    localStorage.setItem(KEY,JSON.stringify({s:cur,a}));
  }catch(e){}
}
function restore(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(!d)return 0;
    document.querySelectorAll('.q').forEach(q=>{
      const v=d.a[q.dataset.k];
      if(v==null)return;
      if(typeof v==='string'){q.querySelector('input,textarea').value=v;return;}
      q.querySelectorAll('.chip').forEach(b=>{
        const on=v.c.includes(cid(b));
        b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
      });
      const oi=q.querySelector('.oi');
      if(oi){oi.value=v.o||'';oi.hidden=!q.querySelector('.oth.on');}
    });
    return d.s;
  }catch(e){return 0;}
}
document.addEventListener('input',save);
const resume=restore();
if(resume>=1&&resume<=S.length)show(resume);
</script>
</body>
</html>
